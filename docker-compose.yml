services:
  hermes-auth-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-auth-backend:latest
    container_name: hermes-auth-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  default:
    name: hermes-network
